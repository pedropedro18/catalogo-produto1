<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulas de Programação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Aulas de Programação</h1>
    <p class="subtitulo">Programação e criação de websites, do zero ao primeiro projeto online.</p>
    <div class="controlos">
      <input type="search" id="pesquisa" placeholder="Pesquisar aula" aria-label="Pesquisar aula">
      <select id="categoria" aria-label="Filtrar por área">
        <option value="">Todas as áreas</option>
      </select>
    </div>
  </header>

  <main>
    <p id="contagem" class="contagem"></p>
    <section id="lista" class="grelha"></section>
    <p id="vazio" class="vazio" hidden>Nenhuma aula encontrada. Experimenta outra pesquisa ou área.</p>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Aulas de Programação</p>
  </footer>

  <script>
    // Edita esta lista para colocar as tuas aulas
    const aulas = [
      { nome: "Python para Iniciantes", categoria: "Python", nivel: "Iniciante", duracao: "8 aulas", descricao: "Variáveis, condições, ciclos e funções com exercícios práticos." },
      { nome: "Python Intermédio", categoria: "Python", nivel: "Intermédio", duracao: "8 aulas", descricao: "Listas, dicionários, ficheiros e pequenos projetos." },
      { nome: "HTML e CSS", categoria: "Websites", nivel: "Iniciante", duracao: "6 aulas", descricao: "Cria a estrutura e o estilo de uma página web." },
      { nome: "JavaScript Básico", categoria: "Websites", nivel: "Intermédio", duracao: "8 aulas", descricao: "Torna as páginas interativas com eventos e DOM." },
      { nome: "Criar um Website Completo", categoria: "Websites", nivel: "Intermédio", duracao: "10 aulas", descricao: "Do desenho da página até à publicação online." },
      { nome: "Apps com Streamlit", categoria: "Python", nivel: "Intermédio", duracao: "5 aulas", descricao: "Cria aplicações web em Python e publica-as." },
      { nome: "Bases de Dados MySQL", categoria: "Dados", nivel: "Intermédio", duracao: "6 aulas", descricao: "Tabelas, consultas SQL e ligação ao Python." },
      { nome: "Git e GitHub", categoria: "Ferramentas", nivel: "Iniciante", duracao: "3 aulas", descricao: "Guarda versões do código e publica os teus projetos." }
    ];

    const lista = document.getElementById("lista");
    const pesquisa = document.getElementById("pesquisa");
    const categoria = document.getElementById("categoria");
    const contagem = document.getElementById("contagem");
    const vazio = document.getElementById("vazio");

    [...new Set(aulas.map(a => a.categoria))].sort().forEach(c => {
      const opcao = document.createElement("option");
      opcao.value = c;
      opcao.textContent = c;
      categoria.appendChild(opcao);
    });

    function mostrar() {
      const texto = pesquisa.value.trim().toLowerCase();
      const cat = categoria.value;

      const filtradas = aulas.filter(a =>
        (!cat || a.categoria === cat) &&
        (a.nome.toLowerCase().includes(texto) || a.descricao.toLowerCase().includes(texto))
      );

      lista.innerHTML = "";
      filtradas.forEach(a => {
        const cartao = document.createElement("article");
        cartao.className = "cartao";
        cartao.innerHTML = `
          <div class="imagem" aria-hidden="true">&lt;/&gt;</div>
          <div class="info">
            <span class="etiqueta">${a.categoria}</span>
            <h2>${a.nome}</h2>
            <p>${a.descricao}</p>
            <div class="meta">
              <span>${a.nivel}</span>
              <span>${a.duracao}</span>
            </div>
          </div>`;
        lista.appendChild(cartao);
      });

      contagem.textContent = filtradas.length + (filtradas.length === 1 ? " aula" : " aulas");
      vazio.hidden = filtradas.length > 0;
    }

    pesquisa.addEventListener("input", mostrar);
    categoria.addEventListener("change", mostrar);
    mostrar();
  </script>
</body>
</html>
